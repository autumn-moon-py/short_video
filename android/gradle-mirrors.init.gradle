def configureRepositories = { repositories, boolean includeGradlePluginPortal = false ->
    repositories.clear()
    repositories.maven { url = uri('https://maven.aliyun.com/repository/gradle-plugin') }
    repositories.maven { url = uri('https://maven.aliyun.com/repository/google') }
    repositories.maven { url = uri('https://maven.aliyun.com/repository/public') }
    repositories.maven { url = uri('https://maven.aliyun.com/repository/central') }
    repositories.google()
    repositories.mavenCentral()
    if (includeGradlePluginPortal) {
        repositories.gradlePluginPortal()
    }
}

beforeSettings { settings ->
    configureRepositories(settings.pluginManagement.repositories, true)
}

settingsEvaluated { settings ->
    configureRepositories(settings.pluginManagement.repositories, true)
    configureRepositories(settings.dependencyResolutionManagement.repositories, false)
}
